name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      GEON_USE_INSTALLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel cmake ninja

      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libopengl0

      - name: Build and install
        run: python -m pip install --no-cache-dir --force-reinstall ".[test]"

      - name: Show imported package path
        run: python -c "import geon.data.pointcloud as p; print(p.__file__)"

      - name: Run tests
        run: python -m pytest -ra
